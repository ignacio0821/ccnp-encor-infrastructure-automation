name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Code Quality Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Execute Programmatic Code Formatting Check (Black Scan)
      run: |
        black --check .
